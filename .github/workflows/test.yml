name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: syntax
        run: |
          perl -Ilib -c select-layout
          for m in $(find lib -name '*.pm'); do perl -Ilib -c "$m"; done
      - name: unit tests
        run: prove -l t
